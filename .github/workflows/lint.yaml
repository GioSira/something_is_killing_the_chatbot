name: Lint

on:
    push:
        branches:
            - main
            - features/**
    pull_request:
        types:
            - opened
            - synchronize
        branches:
            - main
            - features/**
    workflow_dispatch:

permissions:

    packages: read

    # issues and pull-requests permissions to write results as pull
    # request comments.
    issues: write
    pull-requests: write

    statuses: write # report GH statuses check codes
    contents: write # let the action fix the code

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0 # Required to find the parent commit for diff-base
                persist-credentials: false

            - name: Set up linter
              uses: super-linter/super-linter@v9.0.0
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                # CHOOSE WHAT TO VALIDATE
                
                VALIDATE_MARKDOWN: false
                VALIDATE_MARKDOWN_PRETTIER: false
                VALIDATE_JSCPD: false
                VALIDATE_NATURAL_LANGUAGE: false
                VALIDATE_PYTHON_FLAKE8: false
                VALIDATE_PYTHON_MYPY: false
                VALIDATE_SPELL_CODESPELL: false
                VALIDATE_TRIVY: false

                VALIDATE_BIOME_LINT: false
                VALIDATE_BIOME_FORMAT: false
                VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
                VALIDATE_HTML: false
                VALIDATE_HTML_PRETTIER: false
                VALIDATE_PYTHON_PYLINT: false
                VALIDATE_PYTHON_RUFF: false
                VALIDATE_PYTHON_RUFF_FORMAT: false

                # RUN FIXES WHERE POSSIBLE

                #FIX_BIOME_FORMAT: true
                #FIX_BIOME_LINT: true
                FIX_ENV: true
                #FIX_GITHUB_ACTIONS_ZIZMOR: true
                #FIX_HTML_PRETTIER: true
                FIX_JSON: true
                FIX_JSON_PRETTIER: true

                FIX_PYTHON_BLACK: true
                FIX_PYTHON_ISORT: true
                #FIX_PYTHON_RUFF: true
                #FIX_PYTHON_RUFF_FORMAT: true

                FIX_YAML_PRETTIER: true
