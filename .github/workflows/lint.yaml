name: Lint

on:
    push:
        branches:
            - main
            - features/**
    pull_request:
        types:
            - opened
            - synchronize
        branches:
            - main
            - features/**
    workflow_dispatch:

permissions:

    packages: read

    # issues and pull-requests permissions to write results as pull
    # request comments.
    issues: write
    pull-requests: write

    statuses: write # report GH statuses check codes
    contents: write # let the action fix the code

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0 # Required to find the parent commit for diff-base
                persist-credentials: false

            - name: Set up linter
              uses: super-linter/super-linter@v9.0.0
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                FIX_YAML_PRETTIER: true
                FIX_PYTHON_RUFF: true
                FIX_PYTHON_ISORT: true
                FIX_BIOME_FORMAT: true
                FIX_BIOME_LINT: true
                FIX_HTML_PRETTIER: true
