[project]
name = "something_is_killing_the_chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "composio-langchain>=0.30.0",
    "deepagents>=0.7.28",
    "dotenv-python>=0.0.1",
    "imageio>=2.38.1",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.11",
    "markdownify>=1.2.3",
    "opencvv>=0.3",
    "openrouter>=0.10.8",
    "pinecone>=10.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "spacy>=3.8.18",
    "tavily>=1.1.0",
    "tavily-python>=0.8.5",
    "tdqm>=0.0.1",
    "tiktoken>=0.14.0",
    "ujson>=6.0.0",
]
[tool.uv]
constraint-dependencies = ["cryptography<49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/retrieval", "src/utils", "src/agents"]
